# beyondx (Exynos 9820, Mali-G76, Android 16 base via libhybris):
# bionic's fixed TLS slots (written by libEGL / Mali driver) overlap the start of
# glibc's static TLS -> preload a padding library that occupies that area.
# padding lib is loaded system-wide via /etc/ld.so.preload (LD_PRELOAD is ignored for capability-enabled binaries like lipstick)
# Qt Quick render loop: basic (single GL thread) while bringing up graphics.
QSG_RENDER_LOOP=basic
QT_OPENGL_NO_BGRA=1
