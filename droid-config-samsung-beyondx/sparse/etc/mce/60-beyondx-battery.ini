# Samsung helper power supplies that mce should not treat as chargers (the "wireless"
# supply is fixed in the kernel to report PRESENT only with a pad attached).
# The built-in mce blacklist entries are repeated because a
# configured group replaces the built-in list.
[BatteryUDevDeviceBlacklist]
bcl=true
bms=true
dc=true
fg_adc=true
main=true
parallel=true
pc_port=true
pm8921-dc=true
mfc-charger=true
ps=true
otg=true
